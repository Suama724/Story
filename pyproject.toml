[project]
name = "story"
version = "0.1.0"
description = "Desktop chat application"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "pyside6>=6.12,<6.13",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[dependency-groups]
build = [
    "pyinstaller>=6.22.3 ; sys_platform == 'win32'",
]
